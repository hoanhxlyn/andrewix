name: Debug eval

# Temporary: find why flake evaluation fails with
# "coercedTo: coercedType must not have submodules". Remove once fixed.

on:
  workflow_dispatch:
  push:
    branches: [refactor/host-user-facts]

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        installer: [determinate, cachix]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: matrix.installer == 'determinate'
        uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16
      - if: matrix.installer == 'cachix'
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      - run: nix --version
      - name: Locked nixpkgs and den
        run: |
          nix flake metadata --json | jq '.locks.nodes | {nixpkgs: .nixpkgs.locked, den: .den.locked}'
      - name: Eval with trace
        run: |
          nix eval --show-trace --raw \
            .#nixosConfigurations.home-wsl.config.system.build.toplevel.drvPath 2>&1 | grep -v unpacking | tail -80
