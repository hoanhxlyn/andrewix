# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review settings. The web rules below restate web/AGENTS.md; when they
# disagree, web/AGENTS.md wins and this file should be updated to match.
language: en-US

reviews:
  # Assertive reports style and clean-code findings too, not only bugs.
  profile: assertive
  path_filters:
    # Review only the web SPA; the rest of the repo is Nix/NixOS config.
    - "web/**"
    - "!**/bun.lock"
    # Generated by `bun run walls` from the wallpaper flake inputs.
    - "!**/src/data/walls.ts"
  path_instructions:
    - path: "web/**"
      instructions: |
        React Router v8 SPA run with Bun (never npm, node or tsc), styled with vanilla-extract, built on
        React Aria Components, state in Jotai and nuqs. Review against AGENTS.md and flag:
        - Clean code: dead code, unused exports, props or parameters, duplicated logic that belongs in a
          shared helper, unclear names, functions or components doing several unrelated jobs, comments
          that restate the code, and anything more complex than the task needs.
        - Imports: across folders use the `@/` alias, `./` only within the same folder. Code outside
          `ui/` imports from `@/ui`; inside `ui/`, components import each other by folder (`@/ui/Button`),
          never through `@/ui`. React Aria Components come from their subpath
          (`react-aria-components/<Name>`), never the package root, with one import per module.
        - Class names are joined with `clsx`, not `[...].filter(Boolean).join(" ")`.
        - No `dangerouslySetInnerHTML`. No `biome-ignore`: fix the cause instead.
        - React Aria props replace native ones (`onPress`, `isDisabled`). Component states are styled with
          the `data-hovered`, `data-pressed`, `data-focus-visible` and `data-disabled` attributes, not
          `:hover` or `:disabled`.
        - Routes: `src/routes/` holds route modules only (each one `routes.ts` points at, plus its
          `.css.ts`). A component is never a route: one page's components go in `components/<Page>/`,
          reusable primitives in `ui/`. A page's URL state and actions live in a hook in `src/hooks/`.
        - Settings other than the theme are `atomWithSetting` atoms in IndexedDB with a type guard, never
          `localStorage`. A new file that runs code at module level must be listed in `package.json`
          `sideEffects`.
    - path: "**/src/**/*.css.ts"
      instructions: |
        - Every size, color and duration comes from a token in `styles/tokens.css.ts`; flag magic numbers.
        - Every exported style class (`style`, recipe or sprinkles result) has a JSDoc comment that says
          what the class is for, never how it looks (colors, sizes, variants).
        - Use `sprinkles` when the property and value are in the allowlist (`styles/sprinkles.css.ts`),
          otherwise `inComponents`; never set one property through both on the same element. Selectors
          and media queries go in `inComponents`; `inBase` is only for element selectors in
          `global.css.ts`.
        - A `.css.ts` file imported by a `.tsx` file must not export functions.
    - path: "**/src/**/*.tsx"
      instructions: |
        - Inline `style` may only assign CSS variables through `assignInlineVars`, never style properties.
          A value known at build time is a class; only a value computed at run time uses `createVar()`.
    - path: "**/src/ui/Table/**"
      instructions: |
        `Table` is always rendered inside a React Aria `Virtualizer` with `TableLayout` (see
        `components/Walls/WallTable.tsx`). The layout positions every row itself and marks the header
        sticky, so the virtualizer gives the header an inline `position: sticky`. Do not flag a missing
        sticky header, row positioning or scroll handling in these styles; flag only a use of `Table`
        outside a `Virtualizer`.
    - path: "**/src/__test__/**"
      instructions: |
        Unit tests use `bun:test`. The folder mirrors `src/` and imports the module under test through the
        `@/` alias. A tested module must not import, even indirectly, `import.meta.glob`, a `virtual:`
        module or a `.css.ts` file.
    - path: "**/e2e/**"
      instructions: |
        Playwright specs against the built site. Pictures from GitHub are stubbed per test, so a spec must
        not depend on the network. Prefer role and label locators over CSS selectors.

knowledge_base:
  code_guidelines:
    enabled: true
    # The root AGENTS.md is the NixOS config guide; scope it away from web/, whose own
    # web/AGENTS.md is still picked up by the default **/AGENTS.md pattern.
    filePatterns:
      - files: "AGENTS.md"
        applyTo: "modules/**, scripts/**, config/**, secrets/**, flake.nix, install.fish, Justfile"
